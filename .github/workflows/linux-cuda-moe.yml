name: linux-cuda build of upstream PR 30966 (moe-cache CPU misses, sm_89, OpenMP, CUDA 13.4)

on:
  push:
    branches: [ci-linux-pr30966]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.4.3-devel-ubuntu24.04
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git cmake ninja-build ccache build-essential > /dev/null

      - uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: refs/pull/30966/head

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON \
            -DGGML_OPENMP=ON \
            -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=89 \
            -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined \
            -DLLAMA_BUILD_BORINGSSL=ON
          cmake --build build -j $(nproc) --target llama-server llama-bench llama-cli llama-perplexity

      - name: Pack
        run: |
          mkdir -p pack
          cp -a build/bin/* pack/
          find build -name "*.so*" -exec cp -a {} pack/ \;
          cp -a /usr/local/cuda/lib64/libcudart.so.13* /usr/local/cuda/lib64/libcublas.so.13* /usr/local/cuda/lib64/libcublasLt.so.13* pack/
          git rev-parse HEAD > pack/COMMIT.txt
          tar czf llama-linux-cuda13.4-sm89-pr30966-omp.tar.gz -C pack .

      - uses: actions/upload-artifact@v4
        with:
          name: llama-linux-cuda13.4-sm89-pr30966-omp
          path: llama-linux-cuda13.4-sm89-pr30966-omp.tar.gz
          retention-days: 7
